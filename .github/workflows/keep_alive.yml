name: Wake up Streamlit App

on:
  schedule:
    - cron: '0 */8 * * *' 
  workflow_dispatch: 

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright & Dependencies
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run Wake-up Script
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const url = 'https://medium-digest-web-with-gsheets-r4nynpfoybx2ju3jbw4rf7.streamlit.app/';
            
            try {
              console.log('正在訪問 App...');
              // 增加超時時間到 60 秒，因為喚醒休眠的 App 比較慢
              await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
              await page.waitForTimeout(10000); 
              
              const wakeupButton = page.getByRole('button', { name: /Yes, get this app back up/i });
              
              if (await wakeupButton.isVisible()) {
                  await wakeupButton.click();
                  console.log('偵測到休眠按鈕，已點擊喚醒！');
                  await page.waitForTimeout(15000); 
              } else {
                  console.log('App 已經是開啟狀態，或是已經成功喚醒。');
              }
            } catch (error) {
              console.error('執行過程中發生錯誤:', error.message);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          "
